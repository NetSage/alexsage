# Zola config for alexsage.com
# Zola version is pinned in .github/workflows/deploy.yml (ZOLA_VERSION).

base_url = "https://alexsage.com"
title = "Alex Sage"
description = "Notes and writing by Alex Sage."
default_language = "en"

# Theme lives directly in templates/, sass/, static/.
compile_sass = true
build_search_index = false

# Original images in content/ are NOT published. Posts show them through the
# site.img component, which publishes a resized WebP copy instead.
ignored_content = ["*.{jpg,jpeg,png,JPG,JPEG,PNG}"]

generate_feeds = true
feed_filenames = ["atom.xml"]

taxonomies = [
    { name = "tags", feed = true },
]

[markdown]
smart_punctuation = true
external_links_no_follow = false

[markdown.highlighting]
# Inline light-dark() colours follow the site's color-scheme, so the theme
# toggle switches code colours too. Picked for contrast (WCAG AA).
light_theme = "light-plus"
dark_theme = "catppuccin-mocha"

[extra]
