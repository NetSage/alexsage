name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  ZOLA_VERSION: "0.23.6"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Download and verify Zola
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tarball="zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLO "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/${tarball}"
          gh attestation verify "$tarball" --repo getzola/zola
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$tarball" -C "$HOME/.local/bin" zola
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          zola --version
          zola build

      - name: Set up SSH
        env:
          NFSN_SSH_KEY: ${{ secrets.NFSN_SSH_KEY }}
          NFSN_KNOWN_HOSTS: ${{ secrets.NFSN_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$NFSN_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$NFSN_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          NFSN_USER: ${{ secrets.NFSN_USER }}
          NFSN_HOST: ${{ secrets.NFSN_HOST }}
        run: |
          rsync -rlz --delete --exclude='/.well-known/' \
            -e "ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            public/ "${NFSN_USER}@${NFSN_HOST}:/home/public/"

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
