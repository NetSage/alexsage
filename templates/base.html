<!DOCTYPE html>
<html lang="{{ config.default_language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  {% block meta %}<meta name="description" content="{{ config.description }}">{% endblock %}
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="{{ get_url(path="atom.xml", trailing_slash=false) }}">
</head>
<body>
  <header>
    <a href="{{ get_url(path="@/_index.md") }}">{{ config.title }}</a>
    <nav>
      <a href="{{ get_url(path="@/blog/_index.md") }}">Blog</a>
      <a href="{{ get_url(path="tags", trailing_slash=true) }}">Tags</a>
      <a href="{{ get_url(path="atom.xml", trailing_slash=false) }}">Feed</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p>Content licensed <a href="https://creativecommons.org/licenses/by/4.0/" rel="license">CC BY 4.0</a>.
       <a href="https://github.com/NetSage/alexsage">Source code</a> MIT.</p>
  </footer>
</body>
</html>
