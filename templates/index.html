{% extends "base.html" %}

{% block content %}
<h1>{{ config.title }}</h1>
{{ section.content | safe }}

{% set blog = get_section(path="blog/_index.md") %}
<h2>Recent posts</h2>
<ul>
  {% for p in blog.pages[:10] %}
  <li><time datetime="{{ p.date }}">{{ p.date }}</time> <a href="{{ p.permalink }}">{{ p.title }}</a></li>
  {% endfor %}
</ul>
<p><a href="{{ blog.permalink }}">All posts</a></p>
{% endblock %}
