{% extends "base.html" %}

{% block title %}Tag: {{ term.name }} · {{ config.title }}{% endblock %}

{% block content %}
<h1>Tag: {{ term.name }}</h1>
<ul>
  {% for p in term.pages %}
  <li><time datetime="{{ p.date }}">{{ p.date }}</time> <a href="{{ p.permalink }}">{{ p.title }}</a></li>
  {% endfor %}
</ul>
<p><a href="{{ get_url(path="tags", trailing_slash=true) }}">All tags</a></p>
{% endblock %}
