{% extends "base.html" %}

{% block title %}{{ section.title }} · {{ config.title }}{% endblock %}

{% block content %}
<h1>{{ section.title }}</h1>
{{ section.content | safe }}
<ul>
  {% for p in section.pages %}
  <li><time datetime="{{ p.date }}">{{ p.date }}</time> <a href="{{ p.permalink }}">{{ p.title }}</a></li>
  {% endfor %}
</ul>
{% endblock %}
