{% extends "base.html" %}

{% block title %}Tags · {{ config.title }}{% endblock %}

{% block body_class %}tags{% endblock %}

{% block content %}
<header class="section-header">
  <h1>Tags</h1>
</header>

<ul class="term-list">
  {% for term in terms %}
  <li><a href="{{ term.permalink }}">{{ term.name }}</a> <span class="count">{{ term.page_count }}</span></li>
  {% else %}
  <li>No tags yet.</li>
  {% endfor %}
</ul>
{% endblock %}
